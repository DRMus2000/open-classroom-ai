<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂 AI · 学习助手</title><link rel="stylesheet" href="chat.css?v=ui-fix-20260918c"></head>
<body><svg style="display:none" aria-hidden="true"><defs><symbol id="spark" viewBox="0 0 24 24"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="menu-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="clip" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2M6 15 16 5"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol></defs></svg>
<div class="layout"><button id="shade" class="shade" aria-label="关闭侧栏"></button><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark"><svg><use href="#spark"/></svg></span>课堂 AI<button class="icon-button mobile-close" id="close-menu" aria-label="关闭侧栏">×</button></div><button class="new-chat" id="newchat"><svg><use href="#plus"/></svg>开启新对话</button><div class="history-wrap"><h2 class="eyebrow">最近对话</h2><nav id="history" class="history" aria-label="历史对话"></nav><button id="more" class="quiet" hidden>查看更多</button></div><div class="profile"><div class="profile-icon" id="profile-icon">同</div><div><strong id="student-name">同学</strong><small>保持好奇，慢慢弄懂。</small></div></div></aside>
<main class="main"><header class="topbar"><div class="top-title"><button class="icon-button menu" id="menu" aria-label="展开历史对话"><svg><use href="#menu-icon"/></svg></button>学习助手<span>课堂 AI</span></div><span id="quota" class="quota">正在连接…</span></header>
<section id="change" class="change-card" hidden><div class="welcome-symbol"><svg><use href="#spark"/></svg></div><h1>欢迎来到课堂 AI</h1><p>先设置一个自己的密码，然后就可以开始提问了。</p><label for="current">当前密码</label><input id="current" type="password" autocomplete="current-password"><label for="newpass">新密码 · 至少 8 位</label><input id="newpass" type="password" autocomplete="new-password"><button class="send-button" id="changebtn">保存密码并重新登录</button><p id="change-status" role="status"></p></section>
<div class="scroll" id="scroll"><div class="welcome" id="welcome"><div class="welcome-symbol"><svg><use href="#spark"/></svg></div><h1>今天，想弄懂什么？</h1><p>一个问题，是探索的开始。<br>把你的想法写下来，我们一起往前一步。</p></div><div class="messages" id="messages" hidden></div></div>
<footer class="composer-area" id="compose"><div class="composer-wrap"><p class="status" id="status" role="status"></p><div class="composer"><div id="file-list" class="file-list"></div><div class="prompt-wrap"><textarea id="prompt" rows="2" maxlength="1000" aria-label="输入问题" placeholder="向课堂 AI 提问…"></textarea><span id="char-count" class="char-count" aria-live="polite">0 / 1000</span></div><div class="composer-toolbar"><div class="accessories"><button id="attach" class="icon-button" title="添加附件（最多 5 个，共 10 MiB）" aria-label="添加附件"><svg><use href="#clip"/></svg></button><input id="files" type="file" multiple hidden accept=".py,.txt,.md,.csv,.json,.yaml,.yml,.log,.png,.jpg,.jpeg,.webp"><select id="encoding" class="encoding" aria-label="附件文本编码" hidden><option value="utf-8">UTF-8</option><option value="gb18030">GB18030</option></select></div><button id="stop" class="stop-button" hidden>停止请求</button><button id="send" class="send-button" disabled><span id="send-label">发送</span><svg><use href="#arrow"/></svg></button></div></div><p class="composer-note">提问经课堂审核后回答 · 最多 1000 字 · Enter 发送，Shift + Enter 换行</p></div></footer></main></div>
<script src="vendor/markdown-it.min.js"></script><script src="app.js?v=ui-fix-20260918d"></script></body></html>
